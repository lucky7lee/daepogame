plugins {
    id 'com.android.application'
}

def verCode = project.hasProperty('versionCode') ? project.property('versionCode').toInteger() : 1
def verName = project.hasProperty('versionName') ? project.property('versionName').toString() : "1.0.${verCode}"

android {
    namespace 'io.github.lucky7lee.tankclash'
    compileSdk 35

    defaultConfig {
        applicationId "io.github.lucky7lee.tankclash"
        minSdk 24
        targetSdk 35
        versionCode verCode
        versionName verName
    }

    signingConfigs {
        release {
            storeFile file("release-key.jks")
            storePassword System.getenv("KEYSTORE_PASSWORD") ?: "tankclash2026"
            keyAlias System.getenv("KEY_ALIAS") ?: "tankclash"
            keyPassword System.getenv("KEY_PASSWORD") ?: "tankclash2026"
        }
    }

    buildTypes {
        debug {
            debuggable true
        }
        release {
            minifyEnabled false
            shrinkResources false
            signingConfig signingConfigs.release
        }
    }

    lint {
        checkReleaseBuilds false
        abortOnError false
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.webkit:webkit:1.11.0'
}
