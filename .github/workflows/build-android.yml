name: Build Android APK & Google Play AAB

on:
  push:
    branches:
      - main
      - master
    paths-ignore:
      - 'android/app/release-key.jks'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    name: Build APK & Play Store AAB
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 2. Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 3. Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: 4. Accept Android SDK Licenses & Prepare SDK 36
        run: |
          if [ -n "$ANDROID_HOME" ] && [ -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
            "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0" > /dev/null 2>&1 || true
          fi

      - name: 5. Sync Latest Web Game Assets into Android Project
        run: |
          mkdir -p android/app/src/main/assets
          cp index.html privacy.html style.css engine.js game.js manifest.json sw.js icon-192.png icon-512.png icon.svg favicon.ico android/app/src/main/assets/

      - name: 6. Prepare Persistent Release Signing Keystore
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          KEYSTORE_PATH="android/app/release-key.jks"
          if [ -n "$RELEASE_KEYSTORE_BASE64" ]; then
            echo "Using RELEASE_KEYSTORE_BASE64 from GitHub Secrets..."
            echo "$RELEASE_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
          elif [ -f "$KEYSTORE_PATH" ]; then
            echo "Using existing release-key.jks from repository..."
          else
            echo "Generating new release-key.jks for APK & Google Play AAB signing..."
            keytool -genkeypair -v \
              -keystore "$KEYSTORE_PATH" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -alias tankclash \
              -storepass tankclash2026 \
              -keypass tankclash2026 \
              -dname "CN=Tank Clash, OU=Game, O=Lucky7Lee, L=Seoul, S=Seoul, C=KR"
          fi

      - name: 7. Build Signed Release APK & Google Play AAB
        working-directory: android
        run: |
          gradle assembleRelease bundleRelease \
            -PversionCode=${{ github.run_number }} \
            -PversionName=1.0.${{ github.run_number }} \
            --no-daemon --stacktrace

      - name: 8. Collect Output Files
        run: |
          mkdir -p dist_output
          cp android/app/build/outputs/apk/release/app-release.apk dist_output/TankClash-release.apk
          cp android/app/build/outputs/bundle/release/app-release.aab dist_output/TankClash-playstore.aab
          cp playstore-icon-512.png dist_output/playstore-icon-512.png
          cp playstore-feature-graphic.png dist_output/playstore-feature-graphic.png
          cp android/app/release-key.jks dist_output/release-key.jks

      - name: 9. Upload Build Artifacts (APK + AAB + Play Store Graphics)
        uses: actions/upload-artifact@v4
        with:
          name: TankClash-Android-v1.0.${{ github.run_number }}
          path: |
            dist_output/TankClash-release.apk
            dist_output/TankClash-playstore.aab
            dist_output/playstore-icon-512.png
            dist_output/playstore-feature-graphic.png
            dist_output/release-key.jks
          if-no-files-found: error

      - name: 10. Publish / Update GitHub Release for Direct Smartphone Download
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-apk
          name: "💣 탱크 클래시 (Tank Clash) Android APK & Google Play AAB (v1.0.${{ github.run_number }})"
          body: |
            ### 📱 안드로이드 스마트폰 / 스마트탭 설치 파일
            * **`TankClash-release.apk`**: 스마트폰이나 태블릿에서 다운로드하여 바로 설치 및 실행할 수 있는 설치 파일입니다. (오프라인 싱글 플레이 내장 + GitHub 서버리스 2~4인 온라인 멀티플레이 연동)

            ### 🏪 Google Play 스토어 등록용 파일
            * **`TankClash-playstore.aab`**: Google Play Console에 앱 등록 시 업로드하는 정식 Android App Bundle 파일입니다 (`targetSdk 36`, 정식 릴리스 서명 적용).
            * **`playstore-icon-512.png`**: Google Play 스토어 등록용 512x512 고해상도 아이콘입니다.
            * **`playstore-feature-graphic.png`**: Google Play 스토어 등록용 1024x500 그래픽 이미지입니다.
            * **개인정보처리방침 URL**: `https://lucky7lee.github.io/daepogame/privacy.html`
          files: |
            dist_output/TankClash-release.apk
            dist_output/TankClash-playstore.aab
            dist_output/playstore-icon-512.png
            dist_output/playstore-feature-graphic.png
        continue-on-error: true
